<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تثبيت التطبيق</title>
    <style>
        :root {
            --text-main: #ffffff;
            --text-sub: #a0a0a5;
            --btn-install: #5e5ce6; 
            --arrow-color: #2a6877;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(-45deg, #0c1017, #1a1525, #0a1f24, #0c1017);
            background-size: 400% 400%;
            animation: aurora 15s ease infinite;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        @keyframes aurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background: transparent url('https://raw.githubusercontent.com/Leonidas-from-XIV/bulma-templates/master/images/star.png') repeat top center;
            animation: moveStars 60s linear infinite;
            opacity: 0.3;
        }

        @keyframes moveStars { from { background-position: 0 0; } to { background-position: 0 1000px; } }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        #view-details { display: flex; flex-direction: column; height: 100%; }

        .main-content {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding-bottom: 20px;
        }

        .app-icon-wrapper {
            position: relative;
            width: 110px; height: 110px;
            border-radius: 26px;
            margin-bottom: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            overflow: hidden;
            background-color: #1a1a1a;
        }

        .app-icon-wrapper img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .app-icon-wrapper::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(to bottom right, rgba(255,255,255,0) 40%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 60%);
            transform: rotate(45deg);
            animation: shine 4s infinite;
        }

        @keyframes shine {
            0% { transform: translate(-100%, -100%) rotate(45deg); }
            100% { transform: translate(100%, 100%) rotate(45deg); }
        }

        .app-name { font-size: 24px; font-weight: 700; margin-bottom: 5px; text-transform: capitalize; }
        .app-version { font-size: 15px; color: var(--text-sub); margin-bottom: 35px; }
        .install-text { font-size: 15px; margin-bottom: 15px; }

        .arrows { display: flex; flex-direction: column; align-items: center; }
        .arrow {
            width: 12px; height: 12px;
            border-bottom: 2px solid var(--arrow-color);
            border-right: 2px solid var(--arrow-color);
            transform: rotate(45deg); margin-bottom: -4px;
            animation: arrow-pulse 1.5s infinite;
        }
        .arrow:nth-child(2) { animation-delay: 0.2s; }
        .arrow:nth-child(3) { animation-delay: 0.4s; }

        @keyframes arrow-pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

        .bottom-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px 40px 30px;
            background: linear-gradient(to top, rgba(12, 16, 23, 0.9) 30%, rgba(12, 16, 23, 0));
        }

        .cancel-btn { background: none; border: none; color: var(--text-sub); font-size: 17px; font-weight: 500; }
        .install-btn {
            background-color: var(--btn-install); color: #ffffff;
            border: none; border-radius: 12px; padding: 14px 0;
            width: 65%; font-size: 17px; font-weight: 600;
        }
        .install-btn:active { opacity: 0.8; }

        #view-loading {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; background-color: #050505; padding: 30px; text-align: center;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #3b82f6; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 25px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-title { font-size: 22px; font-weight: 700; margin-bottom: 15px; }
        .loading-subtitle { font-size: 15px; color: var(--text-sub); line-height: 1.5; }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        <!-- الواجهة الأولى -->
        <div id="view-details">
            <div class="main-content">
                <div class="app-icon-wrapper">
                    <!-- الصورة يتم سحبها من مجلد الصور في سيرفرنا بناءً على الاسم -->
                    <img id="appImage" src="" alt="App Icon">
                </div>
                <h1 class="app-name" id="appNameDisplay">App</h1>
                <p class="app-version" id="appVersionDisplay">v1.0</p>
                <p class="install-text">تثبيت</p>
                <div class="arrows"><div class="arrow"></div><div class="arrow"></div><div class="arrow"></div></div>
            </div>

            <div class="bottom-bar">
                <button class="cancel-btn" onclick="closeApp()">إلغاء</button>
                <button class="install-btn" id="startInstallBtn">تثبيت</button>
            </div>
        </div>

        <!-- الواجهة الثانية -->
        <div id="view-loading">
            <div class="spinner"></div>
            <h2 class="loading-title">جاري التثبيت...</h2>
            <p class="loading-subtitle">ستظهر رسالة التثبيت بعد قليل، يرجى الانضمام لقناتنا لمتابعة أحدث التطبيقات والتحديثات.</p>
        </div>
    </div>

    <script>
        function closeApp() {
            if (window.history.length > 1) { window.history.back(); } else { window.close(); }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const app = urlParams.get('app') || 'gbox';
        const udid = urlParams.get('udid');

        document.getElementById('appNameDisplay').innerText = app;
        
        const appImageElement = document.getElementById('appImage');
        // السحب من راوتر الـ images في FastAPI
        appImageElement.src = `/images/${app.toLowerCase()}.png`;

        appImageElement.onerror = function() {
            this.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";
        };

        document.getElementById('startInstallBtn').addEventListener('click', function() {
            document.getElementById('view-details').style.display = 'none';
            document.getElementById('view-loading').style.display = 'flex';

            const plistUrl = `https://${window.location.hostname}/api/plist?app=${app}&udid=${udid}`;
            const installUrl = `itms-services://?action=download-manifest&url=${encodeURIComponent(plistUrl)}`;

            setTimeout(() => { window.location.href = installUrl; }, 300);
        });
    </script>
</body>
</html>
